<!DOCTYPE html><html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 時光機 DEMO</title>
  <style>
    body {
      font-family: 'Microsoft JhengHei', sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #222;
    }
    p {
      color: #555;
      margin-bottom: 40px;
    }
    .demo-section {
      background: white;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    input[type="file"] {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #007acc;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
    .result {
      margin-top: 30px;
      font-size: 18px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>歡迎使用 AI 時光機</h1>
  <p>這是一個模擬的變臉動畫影片自動生成平台</p>  <div class="demo-section">
    <h2>上傳人物照片</h2>
    <input type="file" accept="image/*" />
    <br />
    <button onclick="generateDemo()">一鍵生成變臉動畫</button>
    <div class="result" id="result"></div>
  </div>  <script>
    function generateDemo() {
      const result = document.getElementById("result");
      result.innerHTML = "\u{1F4FD} 模擬動畫生成中...（假資料示意）<br>影片將展示：童年→青年→中年→老年→再回到童年";
    }
  </script></body>
</html>
